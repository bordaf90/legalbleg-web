<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borda & Co. | Legal Engineering</title>
    
    <!-- TU FAVICON NATIVO EN CÓDIGO (EL LOGO REAL EN LA PESTAÑA DEL NAVEGADOR) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 160 160'><rect width='100%' height='100%' fill='%23040b14'/><path d='M45 40 H80 C105 40, 105 75, 80 75 H45 V40 Z' fill='none' stroke='%23ffffff' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/><path d='M45 75 H88 C112 75, 112 120, 88 120 H45 V75 Z' fill='none' stroke='%23ffffff' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/><line x1='45' y1='40' x2='45' y2='120' stroke='%23ffffff' stroke-width='10' stroke-linecap='round'/><circle cx='80' cy='40' r='6' fill='%2322d3ee'/><circle cx='68' cy='58' r='6' fill='%2322d3ee'/><circle cx='80' cy='75' r='6' fill='%2322d3ee'/><circle cx='68' cy='98' r='6' fill='%2322d3ee'/><circle cx='88' cy='120' r='6' fill='%2322d3ee'/><line x1='80' y1='40' x2='68' y2='58' stroke='%2322d3ee' stroke-width='3'/><line x1='68' y1='58' x2='80' y2='75' stroke='%2322d3ee' stroke-width='3'/><line x1='80' y1='75' x2='68' y2='98' stroke='%2322d3ee' stroke-width='3'/><line x1='68' y1='98' x2='88' y2='120' stroke='%2322d3ee' stroke-width='3'/></svg>">

    <style>
        /* PALETA DE COLORES PREMIUM DE TU BANNER DE LINKEDIN */
        :root {
            --bg-deep-navy: #040b14;    /* Fondo real ultra oscuro de tu logo */
            --bg-card: #0a1424;         /* Azul noche intermedio para las tarjetas */
            --accent-cyan: #22D3EE;     /* El celeste/cyan de las líneas de los nodos */
            --text-pure-white: #FFFFFF; /* Texto principal en blanco */
            --text-muted-gray: #94A3B8; /* Texto secundario gris claro */
            --border-navy: #1E293B;     /* Bordes estructurales sutiles */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            background-color: var(--bg-deep-navy); 
            color: var(--text-pure-white); 
            line-height: 1.6; 
        }
        
        /* HEADER / NAVBAR */
        .navbar { 
            padding: 20px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border-navy);
            background-color: var(--bg-deep-navy);
        }
        .logo-box { display: flex; items-center: center; align-items: center; gap: 14px; }
        
        /* LOGO OFICIAL VECTORIZADO EN ALTA DEFINICIÓN */
        .logo-svg { width: 50px; height: 50px; }
        .logo-title-container { display: flex; flex-direction: column; justify-content: center; }
        .logo-text { font-size: 20px; font-weight: 700; tracking: 0.5px; color: var(--text-pure-white); font-family: Garamond, Georgia, serif; }
        .logo-sub { font-size: 10px; font-weight: 400; color: var(--text-muted-gray); letter-spacing: 2px; text-transform: uppercase; margin-top: 1px; }
        
        .btn-nav { 
            border: 1px solid var(--accent-cyan); 
            color: var(--accent-cyan); 
            text-decoration: none; 
            padding: 8px 18px; 
            border-radius: 4px; 
            font-size: 13px; 
            font-weight: 600; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease; 
        }
        .btn-nav:hover { background-color: var(--accent-cyan); color: var(--bg-deep-navy); }

        /* HERO SECTION */
        .hero { 
            padding: 100px 40px; 
            max-width: 1200px; 
            margin: 0 auto; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 40px;
        }
        .hero-content { flex: 1; max-width: 650px; }
        .hero h1 { 
            font-size: 46px; 
            font-weight: 800; 
            line-height: 1.15; 
            margin-bottom: 24px; 
            letter-spacing: -0.5px;
        }
        .hero h1 .cyan-highlight { color: var(--accent-cyan); border-bottom: 3px solid var(--accent-cyan); padding-bottom: 4px; }
        .hero p { color: var(--text-muted-gray); font-size: 18px; margin-bottom: 35px; max-width: 550px; }
        .btn-hero { 
            background-color: var(--text-pure-white); 
            color: var(--bg-deep-navy); 
            text-decoration: none; 
            padding: 14px 32px; 
            border-radius: 6px; 
            font-weight: 700; 
            font-size: 15px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block; 
            transition: transform 0.2s; 
        }
        .btn-hero:hover { transform: translateY(-2px); background-color: #E2E8F0; }
        
        .hero-network-bg { flex: 1; display: flex; justify-content: center; max-width: 450px; opacity: 0.15; }

        /* SECCIÓN PROPUESTA DE VALOR / DOLOR */
        .pain-section { 
            padding: 90px 20px; 
            text-align: center; 
            max-width: 850px; 
            margin: 0 auto; 
            border-top: 1px solid var(--border-navy);
        }
        .pain-section h2 { font-size: 30px; font-weight: 700; margin-bottom: 20px; }
        .sub-bar { width: 60px; height: 3px; background-color: var(--accent-cyan); margin: 0 auto 30px auto; }
        .pain-section p { font-size: 17px; color: var(--text-muted-gray); max-width: 750px; margin: 0 auto; }

        /* MARCOS DE AUDITORÍA (TARJETAS PREMIUM) */
        .services-section { padding: 80px 40px; border-top: 1px solid var(--border-navy); }
        .services-container { max-width: 1200px; margin: 0 auto; }
        .services-title { text-align: center; font-size: 24px; font-weight: 700; margin-bottom: 60px; letter-spacing: 1px; text-transform: uppercase; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
        .card { 
            background-color: var(--bg-card); 
            padding: 45px 35px; 
            border-radius: 8px; 
            border: 1px solid var(--border-navy); 
            transition: border-color 0.3s ease;
        }
        .card:hover { border-color: var(--accent-cyan); }
        .card-num { color: var(--accent-cyan); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
        .card h4 { font-size: 20px; font-weight: 700; margin-bottom: 15px; }
        .card-text { color: var(--text-muted-gray); font-size: 15px; line-height: 1.6; }

        /* ABOUT / EXPERTISE COMPARTIDO */
        .about-section { 
            padding: 100px 40px; 
            max-width: 1000px; 
            margin: 0 auto; 
            display: flex; 
            align-items: center; 
            gap: 60px; 
            flex-wrap: wrap;
            border-top: 1px solid var(--border-navy);
        }
        .avatar-frame { 
            border: 2px solid var(--border-navy); 
            padding: 25px; 
            border-radius: 12px; 
            text-align: center;
            background-color: var(--bg-card);
            min-width: 220px;
        }
        .avatar-name { font-size: 20px; font-weight: 700; color: var(--text-pure-white); }
        .avatar-title { font-size: 12px; color: var(--accent-cyan); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }
        .about-content { flex: 1; min-width: 300px; }
        .about-content h3 { font-size: 26px; font-weight: 700; margin-bottom: 20px; }
        .about-p { color: var(--text-muted-gray); font-size: 16px; margin-bottom: 25px; }
        .quote-box { 
            background-color: rgba(34, 211, 238, 0.03); 
            padding: 25px; 
            border-left: 3px solid var(--accent-cyan); 
            border-radius: 0 6px 6px 0; 
            font-style: italic; 
            color: var(--text-pure-white); 
            font-size: 14px; 
        }

        /* FOOTER */
        footer { 
            background-color: var(--bg-deep-navy); 
            color: #475569; 
            padding: 40px 20px; 
            text-align: center; 
            font-size: 12px; 
            border-top: 1px solid var(--border-navy); 
        }
        
        @media (max-width: 968px) {
            .hero { padding: 60px 20px; flex-direction: column; text-align: center; }
            .hero h1 { font-size: 34px; }
            .hero-content { max-width: 100%; }
            .hero-network-bg { display: none; }
            .about-section { flex-direction: column; text-align: center; gap: 40px; }
        }
    </style>
</head>
<body>
